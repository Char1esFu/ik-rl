# Example experiment: override method / training settings without editing Python.
#   .venv/bin/python train.py --exp configs/exp/example.yaml [--set env.reward_scale=0.3 ...]
#
# Only list what differs from the defaults. Every section is optional.
#   env:   IKConfig fields   (ik_rl/config.py)  environment, action scaling, reward, obs_features
#   sac:   SACConfig fields  (ik_rl/config.py)  network / optimizer; obs_dim, act_dim and batch_size are
#                                               set by train.py (use train.batch_size for the batch size)
#   train: train.py options, with underscores (python train.py --help); command-line flags still win
#
# Precedence: defaults < robot env_overrides < this file < --set / --obs-features.
# The resolved values are saved to runs/<robot>/<run>/config.json and every checkpoint.

env:
  smooth_penalty: 0.06
  # obs_features: [q_norm, sin_cos_q, position, orientation, prev_action, prev_collided]

sac:
  gamma: 0.97
  # hidden_dims: [512, 512, 256]

train:
  robot: ur5e
  # total_steps: 1600000
  # seed: 1
