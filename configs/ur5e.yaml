# Universal Robots UR5e (6-DoF). mujoco_menagerie has no plain UR5.
# Units: meters, radians; quaternions [w, x, y, z]. Paths are relative to the repository root.

name: ur5e
display_name: Universal Robots UR5e
scene_xml: mujoco_menagerie/universal_robots_ur5e/scene.xml

arm_joints:
  - shoulder_pan_joint
  - shoulder_lift_joint
  - elbow_joint
  - wrist_1_joint
  - wrist_2_joint
  - wrist_3_joint

# TCP = tool flange (same pose as menagerie's `attachment_site`); no gripper
ee_body: wrist_3_link
ee_offset: [0.0, 0.1, 0.0]
ee_quat: [-1.0, 1.0, 0.0, 0.0]

# Menagerie 'home' keyframe with the shoulder pan at -pi instead of -pi/2: the UR5e base is
# mounted rotated 180 deg about z, so this makes the arm face +x; tool points straight down.
# = [-pi, -pi/2, pi/2, -pi/2, -pi/2, 0]
home_q: [-3.141592653589793, -1.5707963267948966, 1.5707963267948966, -1.5707963267948966, -1.5707963267948966, 0.0]

# Joint box for targets / start configurations. Physical limits: +-2pi (two full turns, hollow-shaft UR
# joints) for all joints except the elbow (+-pi, link self-collision).
#   elbow: physical limit minus a 0.25 rad margin ("soft limit")
#   other joints: one turn, [-pi, pi]. A second turn adds no new poses (q and q +- 2pi are the same pose)
#   but creates "wound-up" start configurations near +-2pi: with the full +-2pi box, single-start success
#   dropped from 90% (start |q| < 3.2) to 62% (start |q| > 4.7), many failures ending pinned at a limit.
#   The policy may still move through the full +-2pi range.
# The shoulder lift covers a full turn, so about half of the samples put the upper arm into the floor:
# ~58% of samples collide (mostly with the floor) and are rejected, which only costs sampling time.
sample_q_low: [-3.1416, -3.1416, -2.8916, -3.1416, -3.1416, -3.1416]
sample_q_high: [3.1416, 3.1416, 2.8916, 3.1416, 3.1416, 3.1416]

# Whole reach around the base (TCP radius <= ~0.95 m, height <= ~1.12 m), above the floor
workspace_low: [-0.9, -0.9, 0.08]
workspace_high: [0.9, 0.9, 1.1]
# Start configurations may lie anywhere around the base (TCP above 5 cm)
start_pos_min: [-.inf, -.inf, 0.05]

