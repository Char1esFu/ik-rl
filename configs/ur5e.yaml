# Universal Robots UR5e (6-DoF). mujoco_menagerie has no plain UR5.
# Units: meters, radians; quaternions [w, x, y, z]. Paths are relative to the repository root.

name: ur5e
display_name: Universal Robots UR5e
scene_xml: mujoco_menagerie/universal_robots_ur5e/scene.xml

arm_joints:
  - shoulder_pan_joint
  - shoulder_lift_joint
  - elbow_joint
  - wrist_1_joint
  - wrist_2_joint
  - wrist_3_joint

# TCP = tool flange (same pose as menagerie's `attachment_site`); no gripper
ee_body: wrist_3_link
ee_offset: [0.0, 0.1, 0.0]
ee_quat: [-1.0, 1.0, 0.0, 0.0]

# Menagerie 'home' keyframe with the shoulder pan at -pi instead of -pi/2: the UR5e base is
# mounted rotated 180 deg about z, so this makes the arm face +x; tool points straight down.
# = [-pi, -pi/2, pi/2, -pi/2, -pi/2, 0]
home_q: [-3.141592653589793, -1.5707963267948966, 1.5707963267948966, -1.5707963267948966, -1.5707963267948966, 0.0]

# Joint box around the forward-facing home:
#   shoulder_pan  [-pi - 1.5, -pi + 1.5]   +-86 deg around the forward direction
#   shoulder_lift [-3.0, -0.15]            keeps the upper arm above the floor
#   elbow         [-2.8, 2.8]              inside the +-pi joint limit
#   wrist_1/2/3   [-pi, pi]                one turn (joint limits are +-2pi)
sample_q_low: [-4.641592653589793, -3.0, -2.8, -3.141592653589793, -3.141592653589793, -3.141592653589793]
sample_q_high: [-1.6415926535897931, -0.15, 2.8, 3.141592653589793, 3.141592653589793, 3.141592653589793]

workspace_low: [0.15, -0.55, 0.08]
workspace_high: [0.85, 0.55, 0.78]

