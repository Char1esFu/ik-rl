# Franka Emika Panda (7-DoF)
# Units: meters, radians; quaternions [w, x, y, z]. Paths are relative to the repository root.

name: franka
display_name: Franka Emika Panda
scene_xml: mujoco_menagerie/franka_emika_panda/scene.xml

# Joints controlled by the policy (in order)
arm_joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]

# Non-arm joints held at a fixed value (gripper fingers open)
fixed_joints:
  finger_joint1: 0.04
  finger_joint2: 0.04

# TCP site attached to `ee_body` (standard Panda TCP)
ee_body: hand
ee_offset: [0.0, 0.0, 0.1034]

home_q: [0.0, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853]

# Joint box for sampling targets and start configurations
# (forward manipulation region, avoids the behind-the-back +-166 deg seam)
sample_q_low: [-1.50, -1.35, -1.50, -2.85, -2.20, 0.35, -2.20]
sample_q_high: [1.50, 1.35, 1.50, -0.35, 2.20, 3.20, 2.20]

# A sampled target is accepted if its TCP lies in this box (and the configuration is collision-free)
workspace_low: [0.15, -0.55, 0.08]
workspace_high: [0.85, 0.55, 0.78]

