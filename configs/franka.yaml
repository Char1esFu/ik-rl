# Franka Emika Panda (7-DoF)
# Units: meters, radians; quaternions [w, x, y, z]. Paths are relative to the repository root.

name: franka
display_name: Franka Emika Panda
scene_xml: mujoco_menagerie/franka_emika_panda/scene.xml

# Joints controlled by the policy (in order)
arm_joints: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]

# Non-arm joints held at a fixed value (gripper fingers open)
fixed_joints:
  finger_joint1: 0.04
  finger_joint2: 0.04

# TCP site attached to `ee_body` (standard Panda TCP)
ee_body: hand
ee_offset: [0.0, 0.0, 0.1034]

home_q: [0.0, 0.0, 0.0, -1.57079, 0.0, 1.57079, -0.7853]

# Joint box for sampling targets and start configurations: physical joint limits minus a 0.25 rad margin
# ("soft limits", like a real controller). Base +-152 deg, so targets surround the robot, including the
# region behind it and around the +-166 deg base seam (the policy learns which way to turn).
# Physical limits: low [-2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973]
#                  high [2.8973, 1.7628, 2.8973, -0.0698, 2.8973, 3.7525, 2.8973]
# ~8% of samples collide (mostly with the floor); ~89% are accepted as targets.
sample_q_low: [-2.6473, -1.5128, -2.6473, -2.8218, -2.6473, 0.2325, -2.6473]
sample_q_high: [2.6473, 1.5128, 2.6473, -0.3198, 2.6473, 3.5025, 2.6473]

# A sampled target is accepted if its TCP lies in this box (and the configuration is collision-free):
# the whole reach around the base (TCP radius <= ~0.94 m), above the floor
workspace_low: [-0.9, -0.9, 0.08]
workspace_high: [0.9, 0.9, 1.2]
# Start configurations may lie anywhere around the base (TCP above 5 cm)
start_pos_min: [-.inf, -.inf, 0.05]

